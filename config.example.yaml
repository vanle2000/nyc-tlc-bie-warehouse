# Copy to config.yaml and fill in. config.yaml is gitignored.
region: us-east-1

s3:
  bucket: my-nyc-tlc-bie-bucket        # a bucket you own in us-east-1
  raw_prefix: raw/
  curated_prefix: curated/
  athena_results_prefix: athena-results/

athena:
  database: nyc_tlc
  workgroup: primary                   # or a dedicated workgroup

redshift:
  workgroup: tlc-serverless            # Redshift Serverless workgroup name
  database: dev
  copy_role_arn: arn:aws:iam::<ACCT>:role/RedshiftCopyRole   # role with s3:GetObject

data:
  service: yellow
  months:                              # Jan 2024 - Mar 2025 (15 months)
    - 2024-01
    - 2024-02
    - 2024-03
    - 2024-04
    - 2024-05
    - 2024-06
    - 2024-07
    - 2024-08
    - 2024-09
    - 2024-10
    - 2024-11
    - 2024-12
    - 2025-01
    - 2025-02
    - 2025-03
